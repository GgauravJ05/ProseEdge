name: Deploy

# Vercel, driven from CI (ADR 0004): a preview per pull request from this
# repository, production on main. The job is skipped until the repository
# defines the variables VERCEL_ORG_ID and VERCEL_PROJECT_ID (from
# .vercel/project.json after `vercel link`) and the secret VERCEL_TOKEN.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vercel:
    name: Vercel
    # Pull requests from forks receive no secrets; skip them instead of failing.
    if: >-
      vars.VERCEL_PROJECT_ID != '' &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      TARGET: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - name: Pull project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm exec vercel pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"
      - name: Build
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          args=(--token="$VERCEL_TOKEN")
          if [ "$TARGET" = production ]; then args+=(--prod); fi
          pnpm exec vercel build "${args[@]}"
      - name: Deploy
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          args=(--prebuilt --token="$VERCEL_TOKEN")
          if [ "$TARGET" = production ]; then args+=(--prod); fi
          # The deployment URL is the only thing vercel deploy writes to stdout.
          url=$(pnpm exec vercel deploy "${args[@]}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"
