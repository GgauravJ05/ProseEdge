name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # A PR opened with the default GITHUB_TOKEN does not trigger other
      # workflows, so its required checks would never run. RELEASE_PLEASE_TOKEN
      # is a fine-grained PAT (contents + pull requests: read/write on this repo).
      # Until it is configured, the release PR is opened but must be nudged
      # (close and reopen) to start CI.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
